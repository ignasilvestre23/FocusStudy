name: focusstudy
description: FocusStudy - App de productividad para estudiantes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  audioplayers: ^6.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm.mp3
    - assets/icon/icon.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"  